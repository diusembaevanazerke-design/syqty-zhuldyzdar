<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жұлдызды сиқыр — қолмен басқару</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020513;color:#fff;font-family:Arial,sans-serif}
  #stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#10274c 0%,#071127 45%,#01030c 100%)}
  canvas{width:100%;height:100%;display:block}
  #video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .panel{position:fixed;left:50%;top:18px;transform:translateX(-50%);text-align:center;width:min(92%,600px);pointer-events:none}
  h1{font-size:clamp(19px,4vw,30px);font-weight:600;letter-spacing:.04em;margin:0 0 8px;text-shadow:0 0 18px #75cfff}
  #status{font-size:14px;color:#b9dfff;background:#0b1b35bb;border:1px solid #527ca477;border-radius:20px;padding:8px 14px;display:inline-block}
  .controls{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;justify-content:center;width:95%;flex-wrap:wrap}
  button{border:1px solid #8acbff88;background:#102b50dd;color:white;border-radius:24px;padding:11px 18px;font-size:14px}
  button:active{transform:scale(.97)} #hint{font-size:12px;color:#a8c7e9;text-align:center;width:100%}
  #camBox{position:fixed;right:12px;bottom:90px;width:120px;height:90px;border:1px solid #78caff66;border-radius:12px;overflow:hidden;background:#071226;display:none}
  #camBox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  @media(min-width:700px){#camBox{display:block}}
</style>
</head>
<body>
<div id="stage"><canvas id="sky"></canvas></div>
<video id="video" playsinline></video>
<div class="panel"><h1>✨ ЖҰЛДЫЗДЫ СИҚЫР ✨</h1><div id="status">«Қолмен басқаруды бастау» батырмасын басыңыз</div></div>
<div id="camBox"><video id="preview" autoplay playsinline muted></video></div>
<div class="controls">
  <button id="start">📷 Қолмен басқаруды бастау</button>
  <button id="reset">✦ Жұлдыздарды жаңарту</button>
  <div id="hint">Бас бармақ пен сұқ саусақты жақындатыңыз — жұлдыздар саусағыңызға жиналады. Ажыратсаңыз — жан-жаққа шашырайды.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');
const video=document.getElementById('video'),preview=document.getElementById('preview');
const statusEl=document.getElementById('status');
let W,H,stars=[],hand=null,pinch=false,camera=null,started=false;
function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';makeStars()}
function makeStars(){stars=Array.from({length:Math.min(650,Math.floor(innerWidth*innerHeight/1500))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.8+.35,a:Math.random()*.7+.25,p:Math.random()*6.28}))}
function draw(){
 ctx.clearRect(0,0,W,H);
 const t=performance.now()*.001;
 let hx=hand?hand.x*W:W*.5,hy=hand?hand.y*H:H*.5;
 for(const s of stars){
   if(hand){
     const dx=hx-s.x,dy=hy-s.y,d=Math.hypot(dx,dy)+.1;
     if(pinch&&d<Math.min(W,H)*.42){let f=(1-d/(Math.min(W,H)*.42))*.035;s.vx+=dx/d*f;s.vy+=dy/d*f}
     else if(!pinch&&d<Math.min(W,H)*.22){s.vx-=dx/d*.008;s.vy-=dy/d*.008}
   }
   s.x+=s.vx;s.y+=s.vy;s.vx*=.985;s.vy*=.985;
   if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;
   let glow=.65+.35*Math.sin(t*2+s.p);
   ctx.beginPath();ctx.arc(s.x,s.y,s.r*devicePixelRatio,0,Math.PI*2);
   ctx.fillStyle=`rgba(160,220,255,${s.a*glow})`;ctx.shadowBlur=pinch?12:5;ctx.shadowColor='#6ccaff';ctx.fill();
 }
 ctx.shadowBlur=0;
 if(hand){
   const x=hx,y=hy;
   ctx.beginPath();ctx.arc(x,y,(pinch?22:12)*devicePixelRatio,0,Math.PI*2);
   ctx.strokeStyle=pinch?'#fff2a8':'#8edcff';ctx.lineWidth=2*devicePixelRatio;ctx.shadowBlur=20;ctx.shadowColor='#75cfff';ctx.stroke();ctx.shadowBlur=0;
   if(pinch){ctx.beginPath();ctx.arc(x,y,38*devicePixelRatio,0,Math.PI*2);ctx.strokeStyle='#fff2a866';ctx.stroke()}
 }
 requestAnimationFrame(draw)
}
function onResults(results){
 if(results.multiHandLandmarks&&results.multiHandLandmarks.length){
   const lm=results.multiHandLandmarks[0],thumb=lm[4],index=lm[8];
   const d=Math.hypot(thumb.x-index.x,thumb.y-index.y);
   hand={x:(thumb.x+index.x)/2,y:(thumb.y+index.y)/2};
   pinch=d<.065;
   statusEl.textContent=pinch?'✨ Сиқыр іске қосылды — жұлдыздар жиналып жатыр!':'Қолыңызды көрсетіп, екі саусақты жақындатыңыз';
 }else{hand=null;pinch=false;statusEl.textContent='Қолыңызды камераға көрсетіңіз'}
}
document.getElementById('start').onclick=async()=>{
 if(started)return;
 try{
   statusEl.textContent='Камераға рұқсат беріңіз…';
   const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
   video.srcObject=stream;preview.srcObject=stream;await video.play();await preview.play();
   const hands=new Hands({locateFile:(file)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
   hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});
   hands.onResults(onResults);
   camera=new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:640,height:480});
   camera.start();started=true;document.getElementById('start').textContent='✓ Камера қосылды';
   statusEl.textContent='Қолыңызды камераға көрсетіңіз';
 }catch(e){statusEl.textContent='Камера ашылмады. Бетті HTTPS арқылы ашып, камераға рұқсат беріңіз.';console.error(e)}
};
document.getElementById('reset').onclick=makeStars;
addEventListener('resize',resize);resize();draw();
</script>
</body>
</html>
